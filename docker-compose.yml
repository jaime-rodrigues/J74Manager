version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pgvector_db
    environment:
      POSTGRES_DB: colab
      POSTGRES_USER: colab
      POSTGRES_PASSWORD: colab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis_broker
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: image_embedder_api
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://colab:colab@db:5432/colab
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - .:/app
      - backups:/app/backups

  worker:
    build: .
    container_name: celery_worker
    command: celery -A tasks.celery_app worker --loglevel=info -P solo
    depends_on:
      - api # Garante que o código da API (que contém as tarefas) esteja pronto
      - redis
    environment:
      DATABASE_URL: postgresql://colab:colab@db:5432/colab
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - .:/app

  tester_ui:
    build:
      context: .
      dockerfile: Dockerfile.tester
    container_name: gradio_tester_ui
    ports:
      - "7860:7860"
    volumes:
      - .:/app
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8000

volumes:
  pgdata:
  backups:
