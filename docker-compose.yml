version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pgvector_db
    environment:
      POSTGRES_DB: colab
      POSTGRES_USER: colab
      POSTGRES_PASSWORD: colab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: image_embedder_api
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://colab:colab@db:5432/colab
    volumes:
      - .:/app
      - backups:/app/backups

  tester_ui:
    build:
      context: .
      dockerfile: Dockerfile.tester
    container_name: gradio_tester_ui
    ports:
      - "7860:7860"
    volumes:
      - .:/app
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8000

volumes:
  pgdata:
  backups:
